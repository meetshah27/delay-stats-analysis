[project]
name = "delaystats"
version = "0.1.0"
description = "Pre-registered hypothesis tests on BTS airline delay data with S3, Glue and Athena."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.1",
    "ipykernel>=6",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "nbconvert>=7",
    "nbformat>=5.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "papermill>=2.6",
    "pingouin>=0.5.5",
    "pyarrow>=17",
    "scipy>=1.13",
    "seaborn>=0.13",
    "sqlglot>=25",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# notebook cells render long prose lines as Markdown
"notebooks/*" = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "pingouin.*", "boto3", "boto3.*", "seaborn", "IPython.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
