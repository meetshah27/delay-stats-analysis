name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: make lint
      - name: Mypy
        run: make typecheck
      - name: Pytest
        run: make test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate
      - name: Validate
        run: terraform -chdir=infra init -backend=false -input=false && terraform -chdir=infra validate
